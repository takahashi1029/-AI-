<title>技工指示書ノート</title>

<style>
/* Layout: single-column phone tool, sticky top title, fixed bottom tab bar; cards only for orders */
:root {
  --bg: #eef0f2;          /* porcelain grey */
  --surface: #ffffff;
  --ink: #1b2430;
  --muted: #5b6774;
  --line: #d6dbe1;
  --accent: #2b5a8c;      /* die-stone blue */
  --accent-ink: #ffffff;
  --accent-soft: #dfe8f3;
  --stone: #e7c35a;       /* gypsum yellow */
  --stone-ink: #3d2f05;
  --warn: #b3432c;        /* inlay-wax red */
  --warn-soft: #f6e1dc;
  --ok: #2d7650;
  --ok-soft: #dcefe3;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161b; --surface: #1a2028; --ink: #e5e9ee; --muted: #98a3af; --line: #2b333d;
    --accent: #80b1e6; --accent-ink: #0b1622; --accent-soft: #1f3148;
    --stone: #d8b64a; --stone-ink: #1e1704;
    --warn: #e88c74; --warn-soft: #3a2320; --ok: #76c595; --ok-soft: #1d3327;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161b; --surface: #1a2028; --ink: #e5e9ee; --muted: #98a3af; --line: #2b333d;
  --accent: #80b1e6; --accent-ink: #0b1622; --accent-soft: #1f3148;
  --stone: #d8b64a; --stone-ink: #1e1704;
  --warn: #e88c74; --warn-soft: #3a2320; --ok: #76c595; --ok-soft: #1d3327;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 10px;
}
.top h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .02em; flex: 1; min-width: 0; text-wrap: balance; }
.top .back { background: none; border: 0; color: var(--accent); font: inherit; font-weight: 700; padding: 6px 4px; cursor: pointer; }
main {
  max-width: 720px; margin: 0 auto;
  padding-block: 16px calc(88px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px;
}
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
nav.tabs button {
  background: none; border: 0; font: inherit; color: var(--muted);
  padding: 10px 4px 12px; font-size: 12px; font-weight: 500; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-current="page"] { color: var(--accent); font-weight: 700; }

h2 { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .08em; margin: 0; }
.section { display: flex; flex-direction: column; gap: 10px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 500; min-width: 0; }
input, select, textarea {
  font: inherit; font-size: 16px; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%; min-width: 0;
}
textarea { min-height: 72px; resize: vertical; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.btn {
  font: inherit; font-weight: 700; font-size: 15px; border-radius: 10px; padding: 12px 14px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-align: center;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--warn); border-color: var(--warn); background: transparent; }
.btn.danger.armed { background: var(--warn); color: var(--surface); }
.btn.small { padding: 7px 10px; font-size: 13px; border-radius: 8px; }
.btn.block { width: 100%; }
input.nativefile { font-size: 14px; padding: 10px; background: var(--surface); color: var(--ink); }
input.nativefile::file-selector-button { font: inherit; font-weight: 700; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 10px 14px; margin-right: 10px; cursor: pointer; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row > .grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.err { color: var(--warn); font-size: 13px; font-weight: 700; }
.banner { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.hint { background: var(--accent-soft); color: var(--ink); border-radius: 10px; padding: 10px 12px; font-size: 13px; }

/* chips */
.chip { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; letter-spacing: .04em; white-space: nowrap; }
.st-recv { background: var(--accent-soft); color: var(--accent); }
.st-making { background: var(--stone); color: var(--stone-ink); }
.st-done { background: var(--ok-soft); color: var(--ok); }
.due-late { background: var(--warn); color: var(--surface); }
.due-today { background: var(--warn-soft); color: var(--warn); }
.chip.sample { background: transparent; border: 1px dashed var(--muted); color: var(--muted); }
.filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.filters button { font: inherit; font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); white-space: nowrap; cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* order list */
.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.summary div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.summary b { display: block; font-family: var(--font-num); font-size: 22px; line-height: 1.2; }
.summary span { font-size: 11px; color: var(--muted); font-weight: 700; }
.summary .alert b { color: var(--warn); }
.orders { display: flex; flex-direction: column; gap: 8px; }
.order {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
  display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; text-align: left; font: inherit; color: inherit; cursor: pointer; width: 100%;
}
.order .who { font-weight: 700; font-size: 16px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.order .clinic { font-size: 13px; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.order .what { grid-column: 1 / -1; font-size: 13px; min-width: 0; }
.order .meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.order .due { font-family: var(--font-num); font-size: 12px; color: var(--muted); }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; }

/* photos */
.photos { display: flex; gap: 8px; overflow-x: auto; }
.photo { position: relative; flex: 0 0 auto; }
.photo img { height: 120px; width: auto; max-width: 70vw; border-radius: 8px; border: 1px solid var(--line); display: block; cursor: zoom-in; object-fit: cover; }
.photo .x { position: absolute; top: 4px; right: 4px; background: var(--ink); color: var(--bg); border: 0; border-radius: 99px; width: 26px; height: 26px; font-size: 14px; cursor: pointer; }
.photo-big img { width: 100%; height: auto; max-width: 100%; border-radius: 10px; border: 1px solid var(--line); cursor: zoom-in; display: block; }

/* line items */
.line { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; background: var(--bg); }
.line select, .line input { background: var(--surface); }
.teeth-btn { font: inherit; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; color: var(--muted); cursor: pointer; }
.teeth-btn b { color: var(--ink); font-family: var(--font-num); font-size: 16px; letter-spacing: .04em; }

/* tooth chart: dental formula cross, 16 columns */
.chart { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 4px 6px; }
.chart-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); padding: 0 4px 4px; font-weight: 700; }
.chart-row { display: grid; grid-template-columns: repeat(16, 1fr); }
.chart-row.up { border-bottom: 2px solid var(--ink); padding-bottom: 3px; }
.chart-row.lo { padding-top: 3px; }
.chart-row .tooth:nth-child(9) { border-left: 2px solid var(--ink); }
.tooth { font-family: var(--font-num); font-size: 13px; height: 40px; border: 0; background: none; color: var(--ink); cursor: pointer; padding: 0; min-width: 0; border-radius: 4px; }
.tooth.on { background: var(--accent); color: var(--accent-ink); }
.chart-foot { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); padding: 4px 4px 0; }

/* detail */
dl.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; }
dl.kv dt { color: var(--muted); font-size: 12px; font-weight: 700; padding-top: 2px; }
dl.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.tablewrap { overflow-x: auto; }
table.items { width: 100%; border-collapse: collapse; font-size: 14px; }
table.items th { text-align: left; font-size: 11px; color: var(--muted); font-weight: 700; border-bottom: 1px solid var(--line); padding: 4px 6px; white-space: nowrap; }
table.items td { border-bottom: 1px solid var(--line); padding: 7px 6px; vertical-align: top; }
table.items td.r, table.items th.r { text-align: right; white-space: nowrap; }
.totals { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: 14px; }
.totals .grand { font-size: 20px; font-weight: 700; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.steps button { font: inherit; font-weight: 700; font-size: 14px; padding: 10px 4px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; }
.steps button[aria-pressed="true"].s-recv { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.steps button[aria-pressed="true"].s-making { background: var(--stone); color: var(--stone-ink); border-color: var(--stone); }
.steps button[aria-pressed="true"].s-done { background: var(--ok); color: var(--surface); border-color: var(--ok); }

/* master lists */
.mlist { display: flex; flex-direction: column; gap: 6px; }
.mrow { display: grid; grid-template-columns: 1fr 96px auto; gap: 6px; align-items: center; }
.mrow.c { grid-template-columns: 1fr auto; }

/* overlays */
.overlay { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; }
.overlay .top { position: sticky; }
.overlay .body {
  padding-block: 16px calc(24px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 12px; max-width: 900px; margin: 0 auto;
}
.overlay img.sheet { width: 100%; height: auto; max-width: 100%; background: #fff; box-shadow: 0 2px 14px rgba(0,0,0,.18); display: block; }
.zoomwrap { overflow: auto; }
.zoomwrap img { width: 100%; max-width: none; display: block; }
.zoomwrap.z img { width: 220%; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 99px; font-size: 14px; font-weight: 700; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { .toast { transition: opacity .2s; } }
@media print {
  body.printing > *:not(#sheetOverlay) { display: none !important; }
  body.printing #sheetOverlay { position: static; overflow: visible; background: #fff; }
  body.printing #sheetOverlay .top, body.printing #sheetOverlay .noprint { display: none !important; }
  body.printing #sheetOverlay .body { padding: 0; gap: 0; }
  body.printing img.sheet { box-shadow: none; page-break-after: always; width: 100%; }
}
</style>

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = new Date(s + "T00:00:00"); d.setDate(d.getDate() + n); return ymd(d); };
const jpDate = s => { if (!s) return ""; const [y, m, d] = s.split("-"); return `${y}年${+m}月${+d}日`; };
const md = s => { if (!s) return "—"; const [, m, d] = s.split("-"); return `${+m}/${+d}`; };
const yen = n => "¥" + Math.round(n || 0).toLocaleString("ja-JP");
const num = v => { const n = Number(String(v).replace(/[^\d.-]/g, "")); return Number.isFinite(n) ? n : 0; };
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = "0"; setTimeout(() => t.remove(), 250); }, 1600);
}

/* ---------- storage (IndexedDB on this phone only) ---------- */
const store = {
  db: null, persistent: false,
  mem: { orders: new Map(), photos: new Map(), kv: new Map() },
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open("dental-lab-notes", 1);
        r.onupgradeneeded = () => { const db = r.result; db.createObjectStore("orders", { keyPath: "id" }); db.createObjectStore("photos"); db.createObjectStore("kv"); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
      await this.tx("kv", "readwrite", s => s.put(1, "_probe"));
      this.persistent = true;
    } catch (e) { this.db = null; this.persistent = false; }
  },
  tx(name, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(name, mode); const req = fn(t.objectStore(name));
      t.oncomplete = () => res(req ? req.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  async get(n, k) { if (!this.db) return this.mem[n].get(k); try { return await this.tx(n, "readonly", s => s.get(k)); } catch { return this.mem[n].get(k); } },
  async put(n, v, k) { const key = k === undefined ? v.id : k; this.mem[n].set(key, v); if (!this.db) return; try { await this.tx(n, "readwrite", s => k === undefined ? s.put(v) : s.put(v, k)); } catch { this.persistent = false; } },
  async del(n, k) { this.mem[n].delete(k); if (!this.db) return; try { await this.tx(n, "readwrite", s => s.delete(k)); } catch {} },
  async all(n) { if (!this.db) return [...this.mem[n].values()]; try { return await this.tx(n, "readonly", s => s.getAll()); } catch { return [...this.mem[n].values()]; } },
  async clear(n) { this.mem[n].clear(); if (!this.db) return; try { await this.tx(n, "readwrite", s => s.clear()); } catch {} },
};

/* ---------- master data ---------- */
const DEFAULT_SETTINGS = {
  lab: { name: "", addr: "", tel: "", regNo: "", bank: "" },
  taxRate: 10, nextSlip: 1, nextRecv: 1,
  clinics: [{ id: "c1", name: "さくら歯科クリニック" }, { id: "c2", name: "みなと歯科医院" }],
  items: [
    { id: "i1", name: "前装冠", price: 9500 },
    { id: "i2", name: "FMC", price: 7000 },
    { id: "i3", name: "インレー", price: 4500 },
    { id: "i4", name: "コア（メタル）", price: 3000 },
    { id: "i5", name: "コア（ファイバー）", price: 3500 },
    { id: "i6", name: "4/5冠", price: 6500 },
    { id: "i7", name: "3/4冠", price: 6500 },
    { id: "i8", name: "CAD/CAM冠", price: 9000 },
    { id: "i9", name: "CAD/CAMインレー", price: 6000 },
    { id: "i10", name: "HJC", price: 12000 },
    { id: "i11", name: "ジルコニア", price: 25000 },
    { id: "i12", name: "MB", price: 28000 },
    { id: "i13", name: "義歯（完成）", price: 30000 },
    { id: "i14", name: "義歯（試適）", price: 8000 },
    { id: "i15", name: "ロー堤", price: 3000 },
    { id: "i16", name: "義歯修理", price: 5000 },
  ],
};
let S = structuredClone(DEFAULT_SETTINGS);
let ORDERS = [];
const METALS = ["", "12%金パラ", "銀合金", "チタン", "Co-Cr", "その他"];
const ATTACH = ["対合歯", "BT", "参考模型", "咬合器", "トレー", "人工歯"];
const STATUS = { recv: "受付", making: "製作中", done: "納品済" };
const saveSettings = () => store.put("kv", S, "settings");
const clinicName = id => S.clinics.find(c => c.id === id)?.name || "（医院未設定）";
const lineTotal = l => num(l.price) * num(l.qty);
const orderSubtotal = o => o.lines.reduce((a, l) => a + lineTotal(l), 0);
const taxOf = sub => Math.floor(sub * num(S.taxRate) / 100);

/* tooth notation: Palmer-style cross used on Japanese 指示書 (6┘ = 右上6) */
const QUADS = ["UR", "UL", "LR", "LL"];
function fmtTeeth(t) {
  if (!t || !t.length) return "";
  const g = { UR: [], UL: [], LR: [], LL: [] };
  t.forEach(x => g[x.slice(0, 2)]?.push(+x.slice(2)));
  const out = [];
  if (g.UR.length) out.push(g.UR.sort((a, b) => b - a).join("") + "┘");
  if (g.UL.length) out.push("└" + g.UL.sort((a, b) => a - b).join(""));
  if (g.LR.length) out.push(g.LR.sort((a, b) => b - a).join("") + "┐");
  if (g.LL.length) out.push("┌" + g.LL.sort((a, b) => a - b).join(""));
  return out.join(" ");
}

/* ---------- photos ---------- */
const photoURL = new Map();
async function getPhotoURL(id) {
  if (photoURL.has(id)) return photoURL.get(id);
  const blob = await store.get("photos", id); if (!blob) return "";
  const u = URL.createObjectURL(blob); photoURL.set(id, u); return u;
}
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function shrink(file) {
  const src = URL.createObjectURL(file);
  try {
    const img = await loadImg(src); const max = 1800;
    const r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * r); c.height = Math.round(img.naturalHeight * r);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(b => res(b || file), "image/jpeg", 0.82));
  } catch { return file; } finally { URL.revokeObjectURL(src); }
}
async function hydratePhotos(root = document) {
  for (const img of root.querySelectorAll("img[data-photo]")) { img.src = await getPhotoURL(img.dataset.photo); }
}
async function openPhoto(id) {
  const u = await getPhotoURL(id); if (!u) return;
  const ov = document.createElement("div"); ov.className = "overlay"; ov.id = "photoOverlay";
  ov.innerHTML = `<header class="top"><button class="back" type="button" data-close>‹ 閉じる</button><h1>指示書の写真</h1></header>
    <div class="body"><p class="muted small noprint">写真をタップすると拡大します。</p><div class="zoomwrap"><img src="${u}" alt="指示書の写真"></div></div>`;
  ov.addEventListener("click", e => { if (e.target.closest("[data-close]")) ov.remove(); else if (e.target.tagName === "IMG") e.target.parentElement.classList.toggle("z"); });
  document.body.appendChild(ov);
}

/* ---------- navigation ---------- */

function go(name, param = null, push = true) {
  if (push && !(view.name === name && view.param === param)) history.push(view);
  if (view.name === "form" && name !== "form") discardDraftPhotos();
  view = { name, param }; render(); window.scrollTo(0, 0);
}
function back() { const prev = history.pop() || { name: "list", param: null }; if (view.name === "form" && prev.name !== "form") discardDraftPhotos(); view = prev; render(); window.scrollTo(0, 0); }
$("#backBtn").addEventListener("click", back);

function setChrome(title, showBack, tab) {

function lineHTML(l, i) {

  const row = (L, R) => [8, 7, 6, 5, 4, 3, 2, 1].map(n => b(L, n)).join("") + [1, 2, 3, 4, 5, 6, 7, 8].map(n => b(R, n)).join("");
  return `<div class="chart"><div class="chart-labels"><span>患者の右</span><span>上顎</span><span>患者の左</span></div>
    <div class="chart-row up">${row("UR", "UL")}</div><div class="chart-row lo">${row("LR", "LL")}</div>

function rerenderLines(m) {

  $("#sumNow", m).textContent = yen(orderSubtotal(draft));

function bindForm(m) {
  const val = id => $("#" + id, m)?.value ?? "";
  m.oninput = e => {
    const t = e.target;
    if (t.id === "f-doctor") draft.doctor = t.value;
    else if (t.id === "f-patient") draft.patient = t.value;
    else if (t.id === "f-recv") draft.recvDate = t.value;
    else if (t.id === "f-due") draft.dueDate = t.value;
    else if (t.id === "f-note") draft.note = t.value;
    else if (t.id === "f-time") draft.dueTime = t.value;
    else if (t.id === "f-age") draft.age = t.value;
    else if (t.id === "f-attach") draft.attachOther = t.value;

      const i = +t.closest(".line").dataset.i; const l = draft.lines[i]; const it = S.items.find(x => x.id === t.value);

    const at = e.target.closest("[data-attach]");
    if (at) { const v = at.dataset.attach; draft.attach = draft.attach.includes(v) ? draft.attach.filter(x => x !== v) : [...draft.attach, v]; at.setAttribute("aria-pressed", draft.attach.includes(v)); return; }
    const rp = e.target.closest("[data-rmphoto]");
    if (rp) { const id = rp.dataset.rmphoto; draft.photoIds = draft.photoIds.filter(x => x !== id); if (draft._added.includes(id)) { draft._added = draft._added.filter(x => x !== id); store.del("photos", id); } renderForm(m); hydratePhotos(m); return; }

    else if (act === "toggleChart") { draft.lines[i]._open = !draft.lines[i]._open; rerenderLines(m); }
    else if (act === "tooth") {
      const l = draft.lines[i]; const t = a.dataset.t;

}
document.addEventListener("paste", e => {
  if (view.name !== "form" || !draft) return;
  const fs = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith("image/"));
  if (fs.length) { e.preventDefault(); onFiles(fs); }
});
async function onFiles(files) {
  if (!draft || !files.length) return;
  for (const f of files) { const blob = await shrink(f); const id = uid(); await store.put("photos", blob, id); draft.photoIds.push(id); draft._added.push(id); }
  renderForm($("#main")); hydratePhotos($("#main"));
}
async function saveDraft(m) {
  if (draft.clinicId === "__new") {
    const name = draft._newClinic.trim();
    if (!name) { draft._err = "新しい医院名を入力してください。"; renderForm(m); hydratePhotos(m); return; }
    const c = { id: uid(), name }; S.clinics.push(c); draft.clinicId = c.id; await saveSettings();
  }
  if (!draft.clinicId) { draft._err = "医院を選んでください（設定タブで医院を追加できます）。"; renderForm(m); return; }
  if (!draft.patient.trim() && !draft.photoIds.length) { draft._err = "患者名を入力するか、指示書の写真を付けてください。"; renderForm(m); hydratePhotos(m); return; }
  const removed = draft._orig.filter(id => !draft.photoIds.includes(id));
  const o = { ...draft }; delete o._orig; delete o._added; delete o._newClinic; delete o._err;
  o.lines = o.lines.map(({ _open, ...l }) => ({ ...l, qty: Math.max(1, num(l.qty)), price: num(l.price), name: l.name || "（品名なし）" }));
  const isNew = !o.id;
  if (isNew) { o.id = uid(); o.no = String(S.nextRecv++).padStart(4, "0"); o.createdAt = new Date().toISOString(); await saveSettings(); }
  o.updatedAt = new Date().toISOString();
  await store.put("orders", o);
  removed.forEach(id => { store.del("photos", id); photoURL.delete(id); });
  ORDERS = ORDERS.filter(x => x.id !== o.id).concat(o);
  draft = null;
  toast(isNew ? "受付を保存しました" : "変更を保存しました");
  history = history.filter(h => h.name !== "form" && !(h.name === "detail" && h.param === o.id));
  view = { name: "detail", param: o.id }; render(); window.scrollTo(0, 0);
}

      await store.del("orders", o.id); o.photoIds.forEach(id => { store.del("photos", id); photoURL.delete(id); });
      ORDERS = ORDERS.filter(x => x.id !== o.id); toast("削除しました"); history = []; go("list", null, false);

}

/* ---------- slips drawn on canvas (saved as images on the phone) ---------- */
const W = 1240, H = 1754, MX = 96;
const CF = '"Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif';
function cv() { const c = document.createElement("canvas"); c.width = W; c.height = H; const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, W, H); g.fillStyle = "#111"; g.textBaseline = "alphabetic"; return [c, g]; }
function font(g, size, bold) { g.font = `${bold ? 700 : 400} ${size}px ${CF}`; }
function fitText(g, text, x, y, maxW, align = "left") {
  text = String(text ?? ""); let t = text;
  if (g.measureText(t).width > maxW) { while (t.length > 1 && g.measureText(t + "…").width > maxW) t = t.slice(0, -1); t += "…"; }
  g.textAlign = align; g.fillText(t, align === "right" ? x + maxW : align === "center" ? x + maxW / 2 : x, y); g.textAlign = "left";
}
function labBlock(g, y) {
  const L = S.lab; const x = 760, w = W - MX - x;
  font(g, 28, true); fitText(g, L.name || "（技工所名は設定タブで入力）", x, y, w); y += 40;
  font(g, 21);
  [L.addr, L.tel && `TEL ${L.tel}`, L.regNo && `登録番号 ${L.regNo}`].filter(Boolean).forEach(s => { fitText(g, s, x, y, w); y += 32; });
  return y;
}
function drawHeader(g, title, no, date, clinic, page, pages) {
  font(g, 56, true); g.textAlign = "center"; g.fillText(title.split("").join(" "), W / 2, 150); g.textAlign = "left";
  font(g, 21); g.textAlign = "right"; g.fillText(`No. ${no}`, W - MX, 92); g.fillText(`発行日 ${jpDate(date)}`, W - MX, 122);
  if (pages > 1) g.fillText(`${page} / ${pages}`, W - MX, H - 60); g.textAlign = "left";
  font(g, 34, true); fitText(g, `${clinic}　御中`, MX, 260, 620);
  g.fillRect(MX, 276, 620, 2);
  labBlock(g, 250);
}
function drawTable(g, y, cols, rows, rowH = 50) {
  const x0 = MX, w = W - MX * 2;
  g.fillStyle = "#eef0f2"; g.fillRect(x0, y, w, rowH); g.fillStyle = "#111";
  font(g, 20, true); let x = x0;
  cols.forEach(c => { fitText(g, c.h, x + 10, y + 33, c.w - 20, c.align === "right" ? "right" : "left"); x += c.w; });
  y += rowH; font(g, 22);
  rows.forEach(r => {
    let x = x0;
    cols.forEach((c, i) => { fitText(g, r[i], x + 10, y + 33, c.w - 20, c.align === "right" ? "right" : "left"); x += c.w; });
    g.fillStyle = "#c9ced5"; g.fillRect(x0, y + rowH - 1, w, 1); g.fillStyle = "#111"; y += rowH;
  });
  g.strokeStyle = "#111"; g.lineWidth = 2; g.strokeRect(x0, y - rowH * (rows.length + 1), w, rowH * (rows.length + 1));
  return y;
}
function drawTotals(g, y, sub) {
  const tax = taxOf(sub); const x = W - MX - 460;
  font(g, 22);
  [["小計（税抜）", yen(sub)], [`消費税（${S.taxRate}%）`, yen(tax)]].forEach(([k, v]) => { g.fillText(k, x, y); g.textAlign = "right"; g.fillText(v, W - MX, y); g.textAlign = "left"; y += 38; });
  g.fillRect(x, y - 24, 460, 2); y += 14;
  font(g, 30, true); g.fillText("合計", x, y); g.textAlign = "right"; g.fillText(yen(sub + tax), W - MX, y); g.textAlign = "left";
  return y + 30;
}
function drawGrand(g, y, label, amount) {
  g.strokeStyle = "#111"; g.lineWidth = 2; g.strokeRect(MX, y, 620, 70);
  font(g, 22, true); g.fillText(label, MX + 20, y + 45);
  font(g, 36, true); g.textAlign = "right"; g.fillText(amount, MX + 600, y + 48); g.textAlign = "left";
}
function chunk(arr, n) { const out = []; for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n)); return out.length ? out : [[]]; }

async function makeDeliverySlip(o) {
  try { await document.fonts?.ready; } catch {}
  if (!o.slipNo) { o.slipNo = "D" + String(S.nextSlip++).padStart(5, "0"); await saveSettings(); await store.put("orders", o); }
  const date = o.deliveredDate || today();
  const cols = [{ h: "品名", w: 380 }, { h: "部位", w: 190 }, { h: "シェード", w: 120 }, { h: "数量", w: 90, align: "right" }, { h: "単価", w: 132, align: "right" }, { h: "金額", w: 136, align: "right" }];
  const rows = o.lines.map(l => [l.name, fmtTeeth(l.teeth) || "—", l.shade || "—", String(l.qty), yen(l.price), yen(lineTotal(l))]);
  const pages = chunk(rows, 16); const sub = orderSubtotal(o); const imgs = [];
  pages.forEach((pr, pi) => {
    const [c, g] = cv();
    drawHeader(g, "納品書", o.slipNo, date, clinicName(o.clinicId), pi + 1, pages.length);
    font(g, 22); g.fillText("下記の通り納品いたします。", MX, 330);
    font(g, 24, true); fitText(g, `患者名　${o.patient || "—"} 様`, MX, 390, 620);
    font(g, 21); fitText(g, `担当医　${o.doctor ? o.doctor + " 先生" : "—"}${o.ins ? "　／　" + o.ins : ""}${o.metal ? "　／　" + o.metal : ""}　／　受付No. ${o.no}　／　受付日 ${jpDate(o.recvDate)}`, MX, 428, 1000);
    drawGrand(g, 460, "合計金額（税込）", yen(sub + taxOf(sub)));
    let y = drawTable(g, 570, cols, pr);
    if (pi === pages.length - 1) {
      y = drawTotals(g, y + 50, sub);
      if (o.note) { font(g, 20, true); g.fillText("備考", MX, y + 20); font(g, 20); wrapText(g, o.note, MX, y + 54, W - MX * 2, 30, 5); }
    }
    imgs.push(c.toDataURL("image/png"));
  });
  showSheets(`納品書 ${o.slipNo}`, imgs);
}
function wrapText(g, text, x, y, maxW, lh, maxLines) {
  const lines = []; String(text).split("\n").forEach(par => { let cur = ""; for (const ch of par) { if (g.measureText(cur + ch).width > maxW) { lines.push(cur); cur = ch; } else cur += ch; } lines.push(cur); });
  lines.slice(0, maxLines).forEach((l, i) => g.fillText(l, x, y + i * lh));
}
function showSheets(title, imgs) {
  const inFrame = (() => { try { return window.self !== window.top; } catch { return true; } })();
  const ov = document.createElement("div"); ov.className = "overlay"; ov.id = "sheetOverlay";
  ov.innerHTML = `<header class="top"><button class="back" type="button" data-close>‹ 閉じる</button><h1>${esc(title)}</h1></header>
    <div class="body">
      <div class="hint noprint">画像を長押しすると、写真に保存したりLINE・メールで送ったりできます。${inFrame ? "" : "パソコンでは「印刷」からPDFにもできます。"}</div>
      ${inFrame ? "" : `<button type="button" class="btn primary noprint" data-print>印刷する</button>`}
      ${imgs.map((u, i) => `<img class="sheet" src="${u}" alt="${esc(title)} ${i + 1}ページ目">`).join("")}
    </div>`;
  ov.addEventListener("click", e => {
    if (e.target.closest("[data-close]")) ov.remove();
    if (e.target.closest("[data-print]")) { document.body.classList.add("printing"); window.print(); setTimeout(() => document.body.classList.remove("printing"), 500); }
  });
  document.body.appendChild(ov); ov.scrollTop = 0;
}

      let data; try { data = JSON.parse(restoreText); } catch { toast("貼り付けた内容が読み取れません"); return; }
      if (!data || data.app !== "dental-lab-notes" || !Array.isArray(data.orders)) { toast("このアプリのバックアップではありません"); return; }
      if (!a.classList.contains("armed")) { a.classList.add("armed"); a.textContent = `もう一度押すと${data.orders.length}件で上書き`; setTimeout(() => { if (a.isConnected) { a.classList.remove("armed"); a.textContent = "貼り付けた内容で上書きする"; } }, 4000); return; }
      S = { ...structuredClone(DEFAULT_SETTINGS), ...data.settings, lab: { ...DEFAULT_SETTINGS.lab, ...(data.settings?.lab || {}) } };
      await saveSettings(); await store.clear("orders");
      ORDERS = data.orders.map(o => ({ ...o, photoIds: (o.photoIds || []).filter(id => store.mem.photos.has(id) || store.db) }));
      for (const o of ORDERS) await store.put("orders", o);
      restoreText = ""; toast(`${ORDERS.length}件を復元しました`); renderSettings(m);
    }
    else if (act === "rmSamples") {
      for (const o of ORDERS.filter(o => o.sample)) await store.del("orders", o.id);
      ORDERS = ORDERS.filter(o => !o.sample); toast("サンプルを消しました"); renderSettings(m);
    }
  };
}
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

  await store.open();

  ORDERS = (await store.all("orders")) || [];

    const sm = sampleOrders(); for (const o of sm) await store.put("orders", o);
